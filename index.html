@media (prefers-reduced-motion:no-preference){.env:not(.crack) .seal{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.05)}}}
.seal .mono{position:absolute;inset:0;direction:ltr;font-family:var(--script);font-size:min(17vw,68px);line-height:1;color:#B8924E;text-shadow:0 1px 0 rgba(255,255,255,.7),0 -1px 1px rgba(90,60,20,.35)}
.seal .mono b{position:absolute;font-weight:400}
.seal .mono b:first-child{left:27%;top:24%}
.seal .mono b:last-child{left:49%;top:38%}
.env.crack .seal{opacity:0;transform:translate(-50%,-50%) scale(1.15);pointer-events:none}
.env .hint{position:absolute;left:0;right:0;top:calc(50% + min(27vw,118px) + 26px);z-index:5;text-align:center;color:#8C7458;font-size:1rem;letter-spacing:.04em;transition:opacity .6s}
.env.crack .hint,.env.crack .langs{opacity:0}
.env .langs{position:absolute;top:calc(50% + min(27vw,118px) + 60px);left:50%;transform:translateX(-50%);z-index:5;transition:opacity .6s;background:rgba(251,247,240,.85);border:1px solid rgba(168,132,79,.35);border-radius:999px;padding:2px 18px;box-shadow:0 2px 8px rgba(110,85,50,.12)}
.langs{display:flex;justify-content:center;gap:24px;direction:ltr}
.langs button{background:none;border:0;cursor:pointer;color:var(--soft);letter-spacing:.2em;font-size:.8rem;padding:6px 2px;font-family:var(--serif)}
.langs button[data-l=ar]{font-family:var(--ar);letter-spacing:0;font-size:1rem}
.langs button[aria-pressed=true]{color:var(--goldD);border-bottom:1px solid var(--gold)}

/* hero: palace arch */
.hero{position:relative;height:100vh;height:100dvh;min-height:560px;max-height:1000px;overflow:hidden;background:linear-gradient(#F3DDD3,#F7E8E0 60%,#F3DCD3)}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.hero .tx{position:absolute;left:0;right:0;top:25%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;z-index:3}
.hero .kick{font-size:2rem}
html[lang=ar] .hero .kick{font-size:1.7rem}
.hero .d{font-family:var(--serif);font-size:1.15rem;color:var(--goldD);letter-spacing:.06em;margin-bottom:min(24px,2.5vh)}
html[lang=ar] .hero .d{font-family:var(--ar)}
.hero .nm{font-size:clamp(3rem,min(18vw,9.5vh),5rem);line-height:1.05}
html[lang=ar] .hero .nm{font-size:clamp(2.6rem,min(15vw,8vh),4.2rem);line-height:1.35}
.hero .amp{font-family:var(--script);font-size:2.4rem;color:#9A7A4A;line-height:.8}
.hero .down{margin-top:min(34px,3.5vh);display:flex;flex-direction:column;align-items:center;font-size:1.4rem}
html[lang=ar] .hero .down{font-size:1.2rem}
.hero .down svg{width:18px;height:18px;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.hero .down svg{animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(5px)}}}
.doves{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.doves canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .langs{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:0;right:0;z-index:4}
.hero .langs button{color:#5E4630;text-shadow:0 0 8px #FBF5EC,0 0 3px #FBF5EC}

/* sections */
.torn{position:relative}
.torn::before{content:"";position:absolute;left:0;right:0;top:-14px;height:16px;background:radial-gradient(12px 9px at 12px 16px,var(--lilac) 98%,transparent) 0 0/24px 16px repeat-x}
.blk{padding-block:48px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.peony{width:100%;height:auto;display:block}
.intro p{margin:0;max-width:30ch;color:var(--soft);font-size:1.15rem}
.verse{margin:0;max-width:30ch;font-size:1.25rem;line-height:2;color:var(--ink)}
.verse cite{display:block;font-style:normal;font-size:.95rem;color:var(--gold)}
.cd h2,.loc h2,.rsvp h2,.day h2{margin:0;font-size:2.2rem}
html[lang=ar] .cd h2,html[lang=ar] .loc h2,html[lang=ar] .rsvp h2,html[lang=ar] .day h2{font-size:2rem}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:360px;direction:ltr}
.u{display:flex;flex-direction:column;align-items:center;position:relative}
.u:not(:last-child)::after{content:":";position:absolute;right:-6px;top:4px;font-size:2.2rem;color:var(--gold)}
.u b{font-weight:400;font-size:2.4rem;line-height:1.2;color:var(--goldD);font-variant-numeric:tabular-nums lining-nums;font-family:var(--serif)}
html[lang=ar] .u b{font-family:var(--ar)}
.u span{font-size:.9rem;color:var(--soft)}

.archcard::before{content:"";position:absolute;inset:8px;border:1px solid rgba(138,106,66,.5);border-radius:4px;pointer-events:none;-webkit-mask:inherit;mask:inherit}
.row{display:grid;grid-template-columns:1fr 14px 1.35fr;align-items:center;width:100%;max-width:290px;gap:12px;padding-block:6px;border-bottom:1px solid rgba(138,106,66,.22)}
.row:last-of-type{border-bottom:0}
.row .k{text-align:start;font-size:1.2rem;color:var(--goldD);white-space:nowrap}
.row .v{text-align:end;color:var(--soft);line-height:1.3;font-size:1.05rem}
.row i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);justify-self:center}
.pframe{position:relative;width:100%;margin-top:10px;padding:16% 13% 15%}
.pframe .pf{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(90,65,35,.25))}
.film{position:relative;width:100%;aspect-ratio:3/4;border-radius:50% 50% 0 0/42% 42% 0 0;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(110,80,40,.4)}
.pframe #filmFl{position:absolute;left:-4%;width:108%;bottom:-2%;height:auto;pointer-events:none}
.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%}

.loc .vn{font-size:2.2rem}
.loc .ad{margin:0;color:var(--soft)}
.villa{width:calc(100% + 24px);max-width:420px;height:auto;margin-inline:-12px;filter:drop-shadow(0 14px 16px rgba(90,65,35,.18))}
.loc{background:radial-gradient(120% 70% at 50% 75%,#EFE3D1,var(--lilac) 70%)}
.orn{width:150px;height:18px;color:var(--gold)}
.rsvp p{margin:0;max-width:30ch;color:var(--soft)}
.end{padding-block:40px 70px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.end .script{font-size:2.2rem}
.end .nm{font-size:1.5rem;color:var(--soft)}
html[lang=ar] .end .nm{font-family:var(--ar)}
/* modal */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(60,45,30,.4);padding:16px}
.sheet{position:relative;width:100%;max-width:400px;background:var(--ivory);border-radius:6px;padding:28px 22px 22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.sheet h3{margin:0;text-align:center;font-weight:400;font-size:1.4rem;color:var(--ink)}
.sheet .x{position:absolute;top:8px;inset-inline-end:10px;background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--soft);padding:6px}
.field{display:flex;flex-direction:column;gap:4px;text-align:start}
.field label{font-size:.95rem;color:var(--soft)}
.field input,.field select,.field textarea{background:#fff;border:1px solid #DCCBB3;border-radius:4px;padding:9px 10px;width:100%;min-width:0;resize:vertical}
.chk{display:flex;flex-direction:column;gap:8px;text-align:start}
.chk label{display:flex;align-items:center;gap:10px;cursor:pointer}
